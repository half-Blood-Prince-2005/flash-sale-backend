worker_processes auto;

events {
    worker_connections 1024;
}

http {
    # Don't reveal the nginx version in responses.
    server_tokens off;

    # Docker's internal DNS. Nginx re-checks the container names every 10 seconds,
    # so it notices when an API container is recreated with a new IP.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Log which API container answered each request ($upstream_addr).
    log_format main '$remote_addr "$request" $status $body_bytes_sent '
                    'upstream=$upstream_addr time=${request_time}s';
    access_log /dev/stdout main;
    error_log /dev/stderr warn;

    # Login and register: at most 10 per minute per IP, with a burst of 10.
    # Stops password guessing and stops bcrypt from eating all the CPU.
    limit_req_zone $binary_remote_addr zone=auth:10m rate=10r/m;
    limit_req_status 429;

    upstream api {
        # Shared memory so all nginx workers see the same list of API containers.
        zone api 64k;
        # One line per API container (replicas: 3 in docker-compose.yml).
        # Separate lines matter: if one copy is down, nginx retries the request
        # on the next one. With a single "api" line it gave up after one try.
        # "resolve" re-checks each name, so a recreated container's new IP is picked up.
        server flashsale-api-1:3000 resolve;
        server flashsale-api-2:3000 resolve;
        server flashsale-api-3:3000 resolve;
        # Reuse connections to the API instead of opening one per request.
        keepalive 32;
    }

    server {
        listen 80;

        # Request bodies here are small JSON. Matches express.json()'s 100kb default.
        client_max_body_size 100k;

        # Settings shared by every location below.
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        # The real client IP, so the API doesn't see nginx's address for everyone.
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Containers on the same Docker network connect in well under a millisecond.
        # A stopped container doesn't refuse, it just never answers, so a short
        # timeout stops one dead copy from stalling requests.
        proxy_connect_timeout 1s;
        proxy_read_timeout 15s;

        # If a copy is down, try another one. Nginx only does this for requests
        # that are safe to repeat, like GET. It never re-sends a purchase (POST).
        proxy_next_upstream error timeout http_502 http_503;
        proxy_next_upstream_tries 2;

        location = /api/auth/login {
            limit_req zone=auth burst=10 nodelay;
            proxy_pass http://api;
        }

        location = /api/auth/register {
            limit_req zone=auth burst=10 nodelay;
            proxy_pass http://api;
        }

        location / {
            proxy_pass http://api;
        }
    }
}
